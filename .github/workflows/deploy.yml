name: Start container

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, splunk-app]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check image
        run: docker image inspect splunk-app:local > /dev/null

      - name: Start container
        env:
          SPLUNK_PASSWORD: ${{ secrets.SPLUNK_PASSWORD }}
        run: |
          docker container create \
            --name album-lab \
            --env-file app.env \
            -e SPLUNK_PASSWORD \
            --mount type=volume,source=album-lab-splunk-var,target=/opt/splunk/var \
            --mount type=volume,source=album-lab-mysql-data,target=/var/lib/mysql \
            -p 8002:8000 \
            splunk-app:local

          docker container start album-lab

      - name: Show container logs
        run: docker container logs --tail=80 album-lab

      - name: Provision database
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_APP_PASSWORD: ${{ secrets.MYSQL_APP_PASSWORD }}
        run: |
          set -a
          source app.env
          set +a

          : "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
          : "${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}"

          # Wait for the MySQL socket to become available.
          timeout 120s bash -c '
            until docker exec album-lab \
              mysqladmin --protocol=socket --user=root ping --silent \
              >/dev/null 2>&1; do
              sleep 1
            done
          '

          /home/ubuntu/ansible-venv/bin/ansible-playbook \
            -i 'album-lab,' \
            -c community.docker.docker \
            -u root \
            -e ansible_python_interpreter=/usr/bin/python3.14 \
            ansible/provision-db.yml

